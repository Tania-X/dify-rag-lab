server:
  port: 8081

dify:
  # Dify 对外入口（你的 nginx 暴露 8080）
  base-url: ${DIFY_BASE_URL:http://localhost:8080}
  # 数据集 API Key（知识库 → 设置 → API 访问 生成）
  dataset-api-key: ${DIFY_DATASET_API_KEY:}
  # 聊天助手 App API Key（阶段 5 使用）
  app-api-key: ${DIFY_APP_API_KEY:}
  # 演练知识库 ID
  dataset-id: ${DIFY_DATASET_ID:}
  embedding:
    # OpenAI 兼容 Embedding 端点（与 Dify 里配置的模型一致，才能对照）
    # 例如你的 OPENAI_API_BASE，或 any 兼容网关
    base-url: ${EMBEDDING_BASE_URL:}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:text-embedding-3-small}

weaviate:
  # 宿主访问地址：脚本 01 发布的代理 127.0.0.1:8090；
  # 若 Java 服务跑在 docker_default 网络内则用 http://weaviate:8080
  base-url: ${WEAVIATE_URL:http://localhost:8090}
  # API Key 从环境变量注入，禁止硬编码默认值
  api-key: ${WEAVIATE_API_KEY:}

rewrite:
  # 默认关闭；开启后所有 /api/rag/retrieve、/api/rag/chat、/api/rag/compare 会先做查询改写
  enabled: ${REWRITE_ENABLED:false}
  # OpenAI 兼容 Chat Completions 端点（SiliconFlow / DeepSeek 均可）
  base-url: ${REWRITE_BASE_URL:https://api.siliconflow.cn/v1}
  api-key: ${REWRITE_API_KEY:}
  model: ${REWRITE_MODEL:deepseek-ai/DeepSeek-V3}
  temperature: ${REWRITE_TEMPERATURE:0}
  timeout-seconds: ${REWRITE_TIMEOUT_SECONDS:10}
  prompt-version: ${REWRITE_PROMPT_VERSION:v2}
  cache-ttl-seconds: ${REWRITE_CACHE_TTL_SECONDS:3600}

logging:
  level:
    com.example.difyraglab: INFO
