<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>内部信息安全公告</title></head>
<body>
<h1>星云金融科技 · 内部信息安全公告</h1>
<h2>一、密码策略</h2>
<ul>
<li>员工系统密码有效期 90 天，到期必须修改。</li>
<li>密码长度不得少于 12 位，必须包含大小写字母、数字和特殊字符。</li>
<li>连续 5 次登录失败将锁定账号 30 分钟。</li>
</ul>
<h2>二、敏感数据</h2>
<ul>
<li>生产环境敏感数据禁止下载到个人电脑。</li>
<li>手机号、身份证号、银行卡号展示时必须脱敏。</li>
<li>测试环境禁止使用生产真实数据。</li>
</ul>
<h2>三、外部设备</h2>
<ul>
<li>禁止使用个人 U 盘接入生产终端。</li>
<li>外部协作者访问内网必须使用双因素认证。</li>
</ul>
<h2>四、应急联系</h2>
<p>发现安全事件后，应在 30 分钟内上报信息安全团队。</p>
</body>
</html>
